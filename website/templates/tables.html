{% extends "base.html" %} 
{% block title %}Tables{% endblock %}

{% block content %}

<h1>Tables</h1>
<table border="1" style="width: 50%; margin: 0 auto; text-align: center; border-collapse: collapse;">
    <thead>
        <th>Names</th>
        <th>Actions</th>
    </thead>

    <tbody>
        {% for table in current_user.tables %}
        
        <tr>
            <td>{{ table.table.table_name }}</td>
            <td>
                <form method="POST">
                    <button type="submit" class="btn btn-primary" value="{{ table.table.id }}" id="table_id" name="table_id">Join</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
